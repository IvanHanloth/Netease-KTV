# Use the prebuilt images from GitHub Container Registry instead of building locally.
#   CPU:        docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d --no-build
#   NVIDIA GPU: KTV_SEPARATOR_VARIANT=gpu docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.ghcr.yml up -d --no-build
# Pin a release with KTV_VERSION (e.g. 0.1.2); the default is the latest release.
# Update later with: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
services:
  app:
    image: ghcr.io/ivanhanloth/netease-ktv-app:${KTV_VERSION:-latest}
    pull_policy: missing

  separator:
    image: ghcr.io/ivanhanloth/netease-ktv-separator:${KTV_VERSION:-latest}-${KTV_SEPARATOR_VARIANT:-cpu}
    pull_policy: missing
