# Pushing a version tag (v0.1.2, …) builds the Docker images, pushes them to GitHub Container
# Registry (ghcr.io) and publishes a GitHub Release with notes and pull commands.
#
#   git tag -a v0.1.2 -m "Netease KTV 0.1.2" && git push origin v0.1.2
#
# Images (owner lower-cased, as ghcr.io requires):
#   ghcr.io/<owner>/netease-ktv-app:<version> and :latest          (linux/amd64, linux/arm64)
#   ghcr.io/<owner>/netease-ktv-separator:<version>-cpu and :latest-cpu   (linux/amd64)
#   ghcr.io/<owner>/netease-ktv-separator:<version>-gpu and :latest-gpu   (linux/amd64, NVIDIA CUDA)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v0.1.2'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag matches package.json
        run: |
          version="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # 1.2.0-beta.1 and the like are published as pre-releases (and don't move :latest).
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Typecheck and build
        run: |
          npm ci
          npm run typecheck
          npm run build

  images:
    name: Image ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: netease-ktv-app
            context: .
            platforms: linux/amd64,linux/arm64
            variant: ''
          - name: separator-cpu
            image: netease-ktv-separator
            context: ./separator
            platforms: linux/amd64
            variant: cpu
          - name: separator-gpu
            image: netease-ktv-separator
            context: ./separator
            platforms: linux/amd64
            variant: gpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The CUDA / PyTorch separator base images are large: make room on the runner.
      - name: Free disk space
        if: matrix.variant != ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          base="ghcr.io/${{ needs.check.outputs.owner }}/${{ matrix.image }}"
          version="${{ needs.check.outputs.version }}"
          suffix="${{ matrix.variant && format('-{0}', matrix.variant) || '' }}"
          tags="$base:$version$suffix"
          if [ "${{ needs.check.outputs.prerelease }}" != "true" ]; then tags="$tags,$base:latest$suffix"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ matrix.variant && format('SEPARATOR_TAG={0}', matrix.variant) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Netease KTV ${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: GitHub Release
    needs: [check, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Release notes
        run: |
          owner="${{ needs.check.outputs.owner }}"
          v="${{ needs.check.outputs.version }}"
          {
            # The annotated tag's message first, if there is one.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1 || true
            msg=$(git tag -l --format='%(contents:body)' "$TAG" | sed '/-----BEGIN SSH SIGNATURE-----/,$d')
            if [ -n "$msg" ]; then printf '%s\n\n' "$msg"; fi
            echo "## Docker 镜像"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/$owner/netease-ktv-app:$v"
            echo "docker pull ghcr.io/$owner/netease-ktv-separator:$v-cpu   # 或 $v-gpu（NVIDIA 显卡）"
            echo '```'
            echo
            echo "不想在本机构建镜像时，用预构建镜像启动（KTV_VERSION 默认 latest）："
            echo
            echo '```bash'
            echo "KTV_VERSION=$v docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d --no-build"
            echo '```'
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Netease KTV ${{ needs.check.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
